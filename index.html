<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI SDR Marketing Prospect Kit — Eashan Bajaj</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a1f2c;
    --panel: #112f41;
    --line: #1f4c63;
    --ink: #e9f4fb;
    --ink-2: #a9c5d4;
    --accent: #ffb547;
    --green: #4cd99a;
    --red: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: flex; align-items: center; justify-content: center; padding: 20px; }
  .gate { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 40px 36px; max-width: 460px; width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
  .gate .tag { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 12px; }
  .gate h1 { font-size: 22px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.01em; }
  .gate p { font-size: 14px; color: var(--ink-2); margin: 0 0 24px; line-height: 1.5; }
  .gate label { display: block; font-size: 11px; color: var(--ink-2); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; margin-bottom: 8px; }
  .gate input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 13px 16px; color: var(--ink); font-size: 15px; font-family: inherit; outline: none; transition: border-color 0.15s; }
  .gate input:focus { border-color: var(--accent); }
  .gate .row { display: flex; align-items: center; gap: 10px; margin: 14px 0 22px; font-size: 13px; color: var(--ink-2); }
  .gate .row input { width: auto; }
  .gate button { width: 100%; background: var(--accent); color: #061722; border: none; border-radius: 10px; padding: 13px 18px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; letter-spacing: 0.02em; transition: opacity 0.15s; }
  .gate button:hover { opacity: 0.9; }
  .gate button:disabled { opacity: 0.5; cursor: not-allowed; }
  .gate .err { background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.3); color: var(--red); border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-top: 14px; display: none; }
  .gate .err.show { display: block; }
  .gate .status { font-size: 12px; color: var(--ink-2); margin-top: 14px; text-align: center; display: none; }
  .gate .status.show { display: block; }
  .gate .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,181,71,0.3); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .frame { display: none; width: 100vw; height: 100vh; border: none; background: var(--bg); }
  .frame.show { display: block; }
  body.unlocked { display: block; padding: 0; align-items: stretch; justify-content: stretch; }
  body.unlocked .gate { display: none; }
</style>
</head>
<body>

<div class="gate">
  <div class="tag">Confidential · Ottimate internal</div>
  <h1>AI SDR Marketing Prospect Kit</h1>
  <p>Business case + technical architecture + 28-day execution plan. Contact Eashan Bajaj for the access password.</p>
  <form id="form">
    <label for="pwd">Access password</label>
    <input id="pwd" type="password" autocomplete="current-password" autofocus />
    <div class="row">
      <input id="remember" type="checkbox" />
      <label for="remember" style="margin:0; text-transform:none; letter-spacing:normal; font-size:13px">Remember me on this device</label>
    </div>
    <button type="submit" id="submit">View document</button>
    <div id="err" class="err">Wrong password. Try again.</div>
    <div id="status" class="status"><span class="spin"></span>Decrypting…</div>
  </form>
</div>

  const ITERATIONS = 600000;

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function deriveKey(password, salt) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: ITERATIONS, hash: 'SHA-256' },
      baseKey,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
  }

  async function decrypt(password) {
    const packed = b64ToBytes(PACKED);
    const salt = packed.slice(0, 16);
    const iv = packed.slice(16, 28);
    const authTag = packed.slice(28, 44);
    const ciphertext = packed.slice(44);
    const cipherWithTag = new Uint8Array(ciphertext.length + 16);
    cipherWithTag.set(ciphertext);
    cipherWithTag.set(authTag, ciphertext.length);
    const key = await deriveKey(password, salt);
    const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, cipherWithTag);
    return new TextDecoder().decode(plainBuf);
  }

  function showDocument(plainHTML) {
    frame.srcdoc = plainHTML;
    frame.classList.add('show');
    document.body.classList.add('unlocked');
  }

  async function tryUnlock(password, savePref) {
    errEl.classList.remove('show');
    statusEl.classList.add('show');
    submitBtn.disabled = true;
    try {
      const plainHTML = await decrypt(password);
      if (savePref) localStorage.setItem(STORAGE_KEY, password);
      showDocument(plainHTML);
    } catch (e) {
      submitBtn.disabled = false;
      statusEl.classList.remove('show');
      errEl.classList.add('show');
      pwdInput.select();
      localStorage.removeItem(STORAGE_KEY);
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    tryUnlock(pwdInput.value, rememberInput.checked);
  });

  // Auto-unlock if password was remembered
  const remembered = localStorage.getItem(STORAGE_KEY);
  if (remembered) {
    rememberInput.checked = true;
    tryUnlock(remembered, true);
  }
</script>
</body>
</html>
